name: Build 记一笔 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unpack Android project
        run: unzip -q JiYiBi_Android_Source_v1.0.1-1.zip -d project

      - name: Build installable APK
        working-directory: project/MinimalLedger
        run: gradle --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jiyibi-android-v1.0.1
          path: project/MinimalLedger/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
