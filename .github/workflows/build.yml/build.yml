name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unpack Android project
        run: |
          unzip -q JiYiBi_Android_Source_v1.0.0.zip -d project
      - name: Build installable release APK
        working-directory: project/MinimalLedger
        run: gradle assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jiyibi-android-v1.0.0
          path: project/MinimalLedger/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
